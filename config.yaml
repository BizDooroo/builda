server:
  address: "127.0.0.1:28088"
  log_dir: "logs"

tasks:
  - id: "hello"
    name: "Hello world"
    description: "Print a greeting, wait briefly, and show the current time"
    command: "echo \"Hello ${BUILDA_INPUT_NAME} from ${BUILDA_INPUT_ENVIRONMENT}\"; sleep 1; date"
    timeout: "30s"
    inputs:
      - id: "name"
        name: "Name"
        type: "string"
        default: "builda"
      - id: "environment"
        name: "Environment"
        type: "choice"
        default: "local"
        options:
          - "local"
          - "staging"
          - "prod"

  - id: "list-files"
    name: "List repository files"
    description: "List files under the repository root"
    command: "find . -maxdepth 2 -type f | sort"
    timeout: "30s"

  - id: "slow-count"
    name: "Slow count"
    description: "Print five count lines with a one-second pause"
    command: "for i in 1 2 3 4 5; do echo count=$i; sleep 1; done"
    timeout: "10s"
