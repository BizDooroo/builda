role: controller

server:
  # Keep the controller on a trusted interface. Use HTTPS through a reverse
  # proxy if it is reachable across a trust boundary.
  addresses:
    - "127.0.0.1:28080"
  # Relative paths resolve from the directory holding this config file.
  state_dir: "state"
  max_history: 5000
  heartbeat_interval: "5s"
  offline_after: "30s"
  long_poll_timeout: "25s"

catalogs:
  - id: "projects"
    name: "Projects"
    options:
      - value: "example_app"
        label: "Example app"
        labels: ["android", "ios"]
        values:
          path: "example_app"

jobs:
  - id: "android-build"
    name: "Android build"
    labels: ["linux", "android"]
    timeout: "45m"
    workdir_param: "project"
    script: |
      bash "$BUILDA_WORKSPACE/$BUILDA_PARAM_PROJECT_PATH/tools/build_android.sh" "$BUILDA_PARAM_ACTION"
    parameters:
      - id: "project"
        name: "Project"
        type: "choice"
        required: true
        catalog: "projects"
        catalog_labels: ["android"]
      - id: "action"
        name: "Action"
        type: "choice"
        default: "debug"
        options:
          - value: "debug"
          - value: "release"
          - value: "aab"
          - value: "bump"

  - id: "ios-build"
    name: "iOS build"
    labels: ["macos", "ios"]
    timeout: "2h"
    workdir_param: "project"
    script: |
      bash "$BUILDA_WORKSPACE/app-deploy-tools/scripts/builda_ios_entrypoint.sh" \
        "$BUILDA_WORKSPACE/$BUILDA_PARAM_PROJECT_PATH/tools/build_ios.sh" "$BUILDA_PARAM_ACTION"
    parameters:
      - id: "project"
        name: "Project"
        type: "choice"
        required: true
        catalog: "projects"
        catalog_labels: ["ios"]
      - id: "action"
        name: "Action"
        type: "choice"
        default: "ad-hoc"
        options:
          - value: "ad-hoc"
          - value: "app-store"

agents:
  - id: "linux-android"
    name: "Linux Android agent"
    labels: ["linux", "android"]
  - id: "macos-ios"
    name: "macOS iOS agent"
    labels: ["macos", "ios"]
