name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          gofmt -w main.go main_test.go
          git diff --exit-code

      - name: Check whitespace
        run: git diff --check

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o builda .
